:root{
 --apple-bg-white:#FFFFFF;--apple-bg-light-gray:#F5F5F7;--apple-bg-elevated:#FBFBFD;--apple-bg-dark:#1D1D1F;
 --apple-text-primary:#1D1D1F;--apple-text-secondary:#6E6E73;--apple-text-tertiary:#86868B;
 --apple-link-blue:#0066CC;--apple-link-blue-hover:#0077ED;
 --green:#2D8C3C;--red:#E30000;--yellow:#B25000;
 --apple-radius-card:18px;--apple-radius-card-sm:12px;--apple-radius-pill:980px;
 --apple-shadow-card:0 2px 8px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
 --apple-shadow-hover:0 4px 12px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.10);

 /* legacy aliases used by app logic */
 --bg:var(--apple-bg-light-gray);--card:var(--apple-bg-white);--card2:var(--apple-bg-elevated);
 --border:rgba(0,0,0,.08);--text:var(--apple-text-primary);--muted:var(--apple-text-secondary);
 --accent:var(--apple-link-blue);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--apple-bg-light-gray)}
body{background:var(--apple-bg-light-gray);color:var(--apple-text-primary);

 -webkit-font-smoothing:antialiased;font-size:17px;line-height:1.47;padding-bottom:84px}
header{position:sticky;top:0;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:50;padding:10px 16px;border-bottom:1px solid var(--border)}
header h1{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--apple-text-primary);flex:1}
.iconbtn{background:none;border:none;color:var(--apple-text-secondary);font-size:19px;cursor:pointer;padding:6px}
#gsearch{width:calc(100% - 40px);max-width:680px;display:block;margin:14px auto 4px;background:var(--apple-bg-white);border:1px solid var(--border);border-radius:12px;padding:11px 16px;color:var(--apple-text-primary);font-size:16px;outline:none;box-shadow:var(--apple-shadow-card)}

main{padding:8px 20px;max-width:720px;margin:0 auto}
.page{display:none}.page.active{display:block}
.card{background:var(--apple-bg-white);border:none;border-radius:var(--apple-radius-card);padding:18px;margin-bottom:12px;cursor:pointer;box-shadow:var(--apple-shadow-card);transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--apple-shadow-hover)}
.card:active{transform:scale(.98)}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.badge{display:inline-block;background:var(--apple-bg-elevated);border:1px solid var(--border);color:var(--apple-link-blue);font-size:12px;border-radius:var(--apple-radius-pill);padding:3px 11px;margin:6px 5px 0 0;font-weight:500}
.badge.up{color:var(--green)}.badge.past{color:var(--apple-text-tertiary)}.badge.warn{color:var(--yellow)}.badge.red{color:var(--red)}
.seclabel{color:var(--apple-text-tertiary);font-size:13px;text-transform:none;letter-spacing:-.01em;margin:26px 4px 10px;font-weight:600}
.fab{position:fixed;right:20px;bottom:150px;width:54px;height:54px;border-radius:var(--apple-radius-pill);background:var(--apple-link-blue);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:var(--apple-shadow-hover);z-index:40;transition:transform .2s ease}

.chatfab{position:fixed;right:20px;bottom:94px;width:54px;height:54px;border-radius:var(--apple-radius-pill);background:var(--green);color:#fff;font-size:22px;border:none;cursor:pointer;box-shadow:var(--apple-shadow-hover);z-index:40;transition:transform .2s ease}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{position:relative;flex:1;background:none;border:none;color:var(--apple-text-tertiary);font-size:10px;padding:8px 0 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s ease}
nav.tabs button .ic{font-size:20px}
nav.tabs button.active{color:var(--apple-link-blue)}
.nbadge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:980px;padding:1px 5px}
.modal-bg{position:fixed;inset:0;background:rgba(29,29,31,.4);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;justify-content:center}

.modal{background:var(--apple-bg-white);width:100%;max-width:540px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:22px 22px calc(30px + env(safe-area-inset-bottom));box-shadow:var(--apple-shadow-modal)}
.modal h2{font-size:20px;margin-bottom:14px;letter-spacing:-.02em;font-weight:700}

.btnrow{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:var(--apple-radius-pill);border:none;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
.btn:active{transform:scale(.97);opacity:.85}
.btn.primary{background:var(--apple-link-blue);color:#fff}.btn.green{background:var(--green);color:#fff}

.backbtn{background:none;border:none;color:var(--apple-link-blue);font-size:16px;cursor:pointer;padding:6px 0;margin-bottom:8px;font-weight:500}
.detail h2{font-size:24px;margin-bottom:6px;letter-spacing:-.02em;font-weight:700}
.kv{display:flex;gap:8px;margin:6px 0;font-size:15px}.kv b{color:var(--muted);font-weight:500;min-width:76px}
.maplink{display:inline-block;background:var(--apple-bg-elevated);border:1px solid rgba(0,102,204,.35);color:var(--apple-link-blue);border-radius:var(--apple-radius-pill);padding:10px 16px;font-size:14px;text-decoration:none;margin-top:8px;font-weight:500}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--apple-bg-white);border:none;border-radius:var(--apple-radius-card);padding:16px 10px;text-align:center;box-shadow:var(--apple-shadow-card)}

.nextmeet{background:linear-gradient(135deg,var(--apple-bg-elevated),#EAF2FC);border:none;border-radius:var(--apple-radius-card);padding:18px;margin-bottom:12px;cursor:pointer;box-shadow:var(--apple-shadow-card)}
.empty{text-align:center;color:var(--apple-text-tertiary);padding:36px 18px;font-size:15px;line-height:1.6}
.taskrow{display:flex;align-items:flex-start;gap:12px;background:var(--apple-bg-white);border:none;border-radius:var(--apple-radius-card-sm);padding:13px;margin-bottom:9px;box-shadow:var(--apple-shadow-card)}
.chk{width:22px;height:22px;min-width:22px;border:1.5px solid #C7C7CC;border-radius:50%;cursor:pointer;margin-top:1px;text-align:center;line-height:20px;font-size:12px;color:transparent;transition:all .2s ease}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.taskrow .t{flex:1}.taskrow .t.done{text-decoration:line-through;color:var(--apple-text-tertiary)}
.prog{height:6px;background:rgba(0,0,0,.07);border-radius:var(--apple-radius-pill);overflow:hidden;margin-top:8px}

.foldergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.libslider{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:12px;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}

.fold{background:var(--apple-bg-white);border:none;border-radius:var(--apple-radius-card);padding:16px 8px;text-align:center;cursor:pointer;box-shadow:var(--apple-shadow-card);transition:transform .25s ease,box-shadow .25s ease}

.je .jt{color:var(--apple-text-tertiary);font-size:12px}
.del{float:right;background:none;border:none;color:var(--red);font-size:14px;cursor:pointer}
.chatfs{position:fixed;inset:0;background:var(--apple-bg-light-gray);z-index:200;display:none;flex-direction:column}
.chatfs.open{display:flex}

.msg.me{align-self:flex-end;background:var(--apple-link-blue);color:#fff;border-bottom-right-radius:6px}

.msg.sys{align-self:center;background:none;color:var(--apple-text-tertiary);font-size:13px;text-align:center}
.chatbar{display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px)}

.sendbtn{background:var(--apple-link-blue)}.micbtn{background:var(--apple-bg-white);color:var(--apple-link-blue);border:1.5px solid var(--border)}
.micbtn:active,.sendbtn:active{transform:scale(.9)}

.scopepill.on{border-color:var(--apple-link-blue);color:var(--apple-link-blue);background:rgba(0,102,204,.07)}

.scbadge.p{background:rgba(45,140,60,.12);color:var(--green)}

</style>

let syncMerged=false;
async function googleSync(){
 if(syncMerged)return;syncMerged=true;
 try{
  // self-update: watchdog stamps current app version into hub-link.json
  try{const lr=await fetch('hub-link.json?ts='+Date.now());const lf=await lr.json();
   if(lf.ver && lf.ver!==APP_VER && !sessionStorage.getItem('upgraded_'+lf.ver)){
    sessionStorage.setItem('upgraded_'+lf.ver,'1');
    location.replace(location.pathname+'?fresh='+Date.now());return}
  }catch(e){}
  const r=await fetch('hub-sync.json?ts='+Date.now());const g=await r.json();
  let changed=false;
  // events: add any Google event not already present (match by title+date)
  (g.events||[]).forEach(ev=>{
   const d=(ev.datetime||'').slice(0,16).replace('T','T');
   const exists=db.meetings.some(m=>m.title===ev.title&&m.datetime.slice(0,10)===(ev.datetime||'').slice(0,10));
   if(!exists&&ev.title){
    db.meetings.push({id:uid(),title:ev.title,datetime:(ev.datetime||'').slice(0,16),personId:'',
     location:ev.location||'',mapsUrl:ev.location?mapsLink(ev.location):'',agenda:'',status:'upcoming',
     suggested:[],notes:'From Google Calendar',gcalLink:ev.link||''});
    changed=true}
  });
  // projects: add agent-created projects
  (g.projects||[]).forEach(pr=>{
   if(!pr.title)return;
   const exists=db.projects.some(x=>x.title===pr.title);
   if(!exists){
    db.projects.push({id:uid(),title:pr.title,status:pr.status||'active',
     desc:pr.description||'',nextSteps:pr.next_steps||[],log:[{ts:new Date().toISOString().slice(0,16),text:'Project created by agent'}]});
    changed=true}
  });
  // tasks: add agent/google tasks not present
  (g.tasks||[]).forEach(t=>{
   if(!t.text)return;
   const exists=db.tasks.some(x=>x.text===t.text||(t.gtaskId&&x.gtaskId===t.gtaskId));
   if(!exists){
    db.tasks.push({id:uid(),text:t.text,done:!!t.done,date:t.date||'',priority:'normal',projectId:'',
     subtasks:[],log:[],gtaskId:t.gtaskId||'',source:t.source||'google'});
    changed=true}
  });
  if(changed){localStorage.setItem(KEY,JSON.stringify(db));jadd('Synced from Google ecosystem');render()}
 }catch(e){}
}

 if(m.agenda)h+='<div class="seclabel">Agenda</div><div class="card" style="cursor:default">'+esc(m.agenda)+'</div>';
 h+='<div class="seclabel">Prep / suggested tasks</div>';
 (m.suggested||[]).forEach((s,i)=>h+='<div class="taskrow" style="padding:8px"><div class="chk'+(s.done?' on':'')+'" onclick="togPrep(\''+id+'\','+i+')">✔</div><div class="t '+(s.done?'done':'')+'">'+esc(s.text)+'</div></div>');
 h+='<div class="btnrow"><button class="btn ghost" onclick="addPrep(\''+id+'\')">+ Prep item</button></div>';
 h+='<div class="seclabel">Documents ('+docs.length+')</div>';
 (docs.length?docs:[]).forEach(d=>h+='<div class="card" style="cursor:default"><h3>'+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+(d.urlOrPath?' · <a style="color:var(--accent)" href="'+esc(d.urlOrPath)+'" target="_blank">open</a>':'')+'</div></div>');
 if(!docs.length)h+='<div class="empty" style="padding:8px">No files linked. Add them via Library → +.</div>';
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'meetings\',\''+m.id+'\')">Delete meeting</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}
function togPrep(mid,i){const m=M(mid);m.suggested[i].done=!m.suggested[i].done;if(m.suggested[i].done)jadd('Prep done: '+m.suggested[i].text+' ('+m.title+')');save()}
function addPrep(mid){showModal('<h2>New prep item</h2><input id="fx" placeholder="e.g. Send agenda to Alex"><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="(M(\''+mid+'\').suggested.push({text:$(\'fx\').value.trim()||\'Prep\',done:false}),save(),closeModal(),showMeeting(\''+mid+'\'))">Add</button></div>')}

/* ===== PEOPLE ===== */
function rPeople(){let h='';
 if(!db.people.length)h='<div class="empty">No people yet. Tap <b style="color:var(--accent)">+</b>.</div>';
 if(!db.people.some(p=>matchesScope(p))&&SCOPE){h='<div class="empty">No contacts in this scope.</div>';$('content').innerHTML=h;return}
 db.people.forEach(p=>{if(!matchesScope(p))return;const ms=db.meetings.filter(m=>m.personId===p.id).length;
  h+='<div class="card" onclick=\'showPerson("'+p.id+'")\'><h3>'+esc(p.name)+(p.gcontact?' 🔁':'')+'</h3><div class="sub">'+esc(p.role||'—')+(ms?' · '+ms+' meeting'+(ms>1?'s':''):'')+'</div>'+(p.tags||[]).map(t=>'<span class="badge">'+esc(t)+'</span>').join('')+'</div>'});
 h+='<div class="sub" style="margin-top:6px">🔁 = saved in Google Contacts automatically — every contact you add lands there too.</div>';
 $('content').innerHTML=h}
function showPerson(id){detail={kind:'person',id};const p=P(id);if(!p)return;
 const ms=db.meetings.filter(m=>m.personId===id).sort((a,b)=>b.datetime.localeCompare(a.datetime));
 const docs=db.items.filter(i=>i.personId===id);
 let h='<button class="backbtn" onclick="back()">← Back</button><div class="detail"><h2>'+esc(p.name)+'</h2>';
 (p.tags||[]).forEach(t=>h+='<span class="badge">'+esc(t)+'</span>');
 h+='<div class="meta">'+(p.role?'<div class="kv"><b>Role</b>'+esc(p.role)+'</div>':'')+
 (p.phone?'<div class="kv"><b>Phone</b>'+esc(p.phone)+'</div>':'')+
 (p.email?'<div class="kv"><b>Email</b>'+esc(p.email)+'</div>':'')+
 (p.notes?'<div class="kv"><b>Notes</b>'+esc(p.notes)+'</div>':'')+'</div>';
 h+='<div class="seclabel">Meetings ('+ms.length+')</div>';
 (ms.length?ms:[]).forEach(m=>h+='<div class="card" onclick=\'showMeeting("'+m.id+'")\'><h3>'+esc(m.title)+'</h3><div class="sub">'+fmtDT(m.datetime)+'</div></div>');
 if(!ms.length)h+='<div class="empty" style="padding:8px">No meetings linked.</div>';
 h+='<div class="seclabel">Documents ('+docs.length+')</div>';
 (docs.length?docs:[]).forEach(d=>h+='<div class="card" style="cursor:default"><h3>'+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+'</div></div>');
 if(!docs.length)h+='<div class="empty" style="padding:8px">No documents linked.</div>';
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'people\',\''+p.id+'\')">Delete contact</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}

/* ===== LIBRARY ===== */
let libFolder=null;
function rLibrary(){
 let h='<div class="libslider"><div class="fold" onclick="libFolder=null;render()"><div class="fi">🗂️</div><div class="fn">All files</div><div class="sub">'+db.items.length+'</div></div>';
 db.folders.forEach(f=>{if(!matchesScope(f))return;const n=db.items.filter(i=>i.folderId===f.id&&matchesScope(i)).length;
  h+='<div class="fold" onclick="libFolder=\''+f.id+'\';render()"><div class="fi">'+(f.icon||'📁')+'</div><div class="fn">'+esc(f.name)+'</div><div class="sub">'+n+'</div></div>'});
 h+='</div>';
 if(libFolder){const f=F(libFolder);
  h+='<div class="seclabel">📁 '+esc(f?f.name:'')+'</div>';
  const its=db.items.filter(i=>i.folderId===libFolder&&matchesScope(i));
  if(!its.length)h+='<div class="empty" style="padding:12px">Empty folder.</div>';
  its.forEach(d=>h+=docCard(d));}
 else{const its=db.items.slice().sort((a,b)=>(b.addedDate||'').localeCompare(a.addedDate||''));
  h+='<div class="seclabel">Recent files</div>';
  if(!its.length)h+='<div class="empty" style="padding:12px">Library empty. Tap <b style="color:var(--accent)">+</b> to add files & links.</div>';
  its.forEach(d=>h+=docCard(d));}
 $('content').innerHTML=h}
function openDoc(id){const d=db.items.find(x=>x.id===id);if(!d)return;
 if(d.urlOrPath){window.open(d.urlOrPath,'_blank')}
 else{showModal('<h2>'+esc(d.name)+'</h2><p style="color:var(--muted);font-size:13px;line-height:1.7">This item has no file attached yet. Ask your agent in chat: <b style="color:var(--text)">"attach '+esc(d.name)+'"</b> and it will upload the real file and link it here.</p><div class="btnrow"><button class="btn primary" onclick="closeModal()">OK</button></div>')}}
function docCard(d){const f=F(d.folderId);
 return '<div class="card" onclick="openDoc(\''+d.id+'\')">'+
 '<h3>'+((d.urlOrPath)?'':'🔒 ')+({pdf:'📕',doc:'📘',sheet:'📗',note:'📝',link:'🔗'}[d.type]||'📄')+' '+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+(f?' · '+esc(f.name):'')+(d.addedDate?' · '+d.addedDate:'')+((d.urlOrPath)?'':' · no file linked yet')+'</div></div>'}

/* ===== forms ===== */
function fabAdd(){
 ({today:fTask,tasks:fTask,meetings:fMeeting,people:fPerson,library:fDoc})[page]()}
function opts(arr,val,key,label){return arr.map(o=>'<option value="'+o.id+'"'+(o.id===val?' selected':'')+'>'+esc(label(o))+'</option>').join('')}
function fTask(){showModal('<h2>New task</h2><label>Task *</label><input id="f_text"><label>Due date</label><input id="f_date" type="date" value="'+todayStr()+'"><label>Priority</label><select id="f_pri"><option>normal</option><option value="high">high</option></select><label>Project</label><select id="f_pid"><option value="">none</option>'+opts(db.projects,null,x=>x.title)+'</select><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask()">Save</button></div>')}
function saveTask(){const v=$('f_text').value.trim();if(!v)return alert('Task text required');
 db.tasks.push({id:uid(),text:v,done:false,date:$('f_date').value||'',priority:$('f_pri').value==='high'?'high':'normal',projectId:$('f_pid').value,subtasks:[],log:[]});
 save();closeModal()}
function fMeeting(){
 showModal('<h2>New meeting</h2><label>Title *</label><input id="f_title"><label>Date & time</label><input id="f_dt" type="datetime-local"><label>With</label><select id="f_w"><option value="">— none —</option>'+opts(db.people,null,p=>p.name)+'</select><label>Location (address or place name)</label><input id="f_loc" placeholder="Café Central, downtown…"><label>Agenda</label><textarea id="f_ag" rows="2"></textarea><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMeeting()">Save</button></div><p style="color:var(--muted);font-size:12px;margin-top:10px">A Maps pin is generated from the location automatically, plus standard prep tasks.</p>')}
function saveMeeting(){
 const v=$('f_title').value.trim();if(!v)return alert('Title required');
 const loc=$('f_loc').value.trim();
 db.meetings.push({id:uid(),title:v,datetime:$('f_dt').value||new Date().toISOString().slice(0,16),personId:$('f_w').value,location:loc,mapsUrl:loc?mapsLink(loc):'',agenda:$('f_ag').value.trim(),status:'upcoming',
  suggested:[{text:'Prepare agenda',done:false},{text:'Send confirmation',done:false},{text:'Review linked documents',done:false}],notes:''});
 save();closeModal()}
function fPerson(){showModal('<h2>New contact</h2><label>Name *</label><input id="f_n"><label>Role / company</label><input id="f_r"><label>Phone</label><input id="f_p"><label>Email</label><input id="f_e"><label>Tags (comma sep.)</label><input id="f_t"><label>Notes</label><textarea id="f_no" rows="2"></textarea><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePerson()">Save</button></div>')}
function savePerson(){const n=$('f_n').value.trim();if(!n)return alert('Name required');
 db.people.push({id:uid(),name:n,role:$('f_r').value.trim(),phone:$('f_p').value.trim(),email:$('f_e').value.trim(),notes:$('f_no').value.trim(),tags:$('f_t').value.split(',').map(s=>s.trim()).filter(Boolean),gcontact:''});
 save();closeModal()}
function fDoc(){showModal('<h2>Add to Library</h2><label>Name *</label><input id="f_dn"><label>Type</label><select id="f_dy"><option value="pdf">PDF</option><option value="doc">Document</option><option value="sheet">Spreadsheet</option><option value="note">Note</option><option value="link">Link</option></select><label>Link or path</label><input id="f_du" placeholder="https://… or C:/…"><label>Folder</label><select id="f_df"><option value="">— none —</option>'+opts(db.folders,null,f=>f.name)+'</select><label>Linked person</label><select id="f_dp"><option value="">— none —</option>'+opts(db.people,null,p=>p.name)+'</select><label>Linked meeting</label><select id="f_dm"><option value="">— none —</option>'+opts(db.meetings,null,m=>m.title)+'</select><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDoc()">Save</button></div>')}
function saveDoc(){const n=$('f_dn').value.trim();if(!n)return alert('Name required');
 db.items.push({id:uid(),name:n,type:$('f_dy').value,urlOrPath:$('f_du').value.trim(),folderId:$('f_df').value,personId:$('f_dp').value,meetingId:$('f_dm').value,addedDate:todayStr()});
 save();closeModal()}

/* ===== misc ===== */
function delItem(kind,id){
 if(!confirm('Delete this? Linked references are kept but unlinked.'))return;
 db[kind]=db[kind].filter(x=>x.id!==id);
 db.items.forEach(i=>{if(i.personId===id)i.personId='';if(i.meetingId===id)i.meetingId='';if(i.folderId===id)i.folderId=''});
 db.meetings.forEach(m=>{if(m.personId===id)m.personId=''});
 db.tasks.forEach(t=>{if(t.projectId===id)t.projectId=''});
 detail=null;save()}
function back(){if(detail&&detail.kind==='journal'){go('today')}else{detail=null;render()}}
function globalSearch(q){q=q.trim().toLowerCase();if(!q)return render();if(detail)return;
 let hits=[];
 db.people.forEach(p=>{if((p.name+' '+(p.role||'')).toLowerCase().includes(q))hits.push(['👤 '+p.name,(p.role||''),`showPerson('${p.id}')`])});
 db.meetings.forEach(m=>{if((m.title+' '+(m.agenda||'')+' '+(m.location||'')).toLowerCase().includes(q))hits.push(['📅 '+m.title,fmtDT(m.datetime),`showMeeting('${m.id}')`])});
 db.tasks.forEach(t=>{if(t.text.toLowerCase().includes(q))hits.push([((t.done)?'☑ ':'⬜ ')+t.text,(t.date||''),`showTask('${t.id}')`])});
 db.projects.forEach(p=>{if(p.title.toLowerCase().includes(q))hits.push(['🚀 '+p.title,'project',`showProject('${p.id}')`])});
 db.items.forEach(i=>{if(i.name.toLowerCase().includes(q))hits.push(['📄 '+i.name,i.type.toUpperCase(),'openDoc(\''+i.id+'\')'])});
 db.folders.forEach(f=>{if(f.name.toLowerCase().includes(q))hits.push(['📁 '+f.name,'folder','libFolder=\''+f.id+'\';render()'])});
 db.journal.forEach(d=>d.entries.forEach(e=>{if((e.text||'').toLowerCase().includes(q))hits.push(['📖 '+e.text,d.date,'showJournal()'])}));
 $('content').innerHTML=hits.length?'<div class="seclabel">'+hits.length+' results</div>'+hits.map(x=>'<div class="card" '+(x[2]?'onclick="'+x[2]+'"':'style="cursor:default"')+'><h3>'+esc(x[0])+'</h3><div class="sub">'+esc(x[1])+'</div></div>').join(''):'<div class="empty">No matches for “'+esc(q)+'”.</div>'}
function openSettings(){
 showModal('<h2>Settings & Data</h2><label>Hub Link (connects the 💬 chat to your agent)</label><input id="s_api" placeholder="https://…trycloudflare.com" value="'+esc(cfg.apiUrl||'')+'">'+
 '<div class="btnrow"><button class="btn ghost" onclick="$(\'imp\').click()">Import backup</button><button class="btn primary" onclick="exportAll()">Export backup</button></div>'+
 '<input type="file" id="imp" accept=".json" style="display:none" onchange="importAll(this)">'+
 '<p style="color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6">Data lives in this browser and syncs to your Google ecosystem automatically. If the chat says “not linked”, get the fresh Hub Link from your latest Telegram message and paste it above.</p>'+
 '<div class="btnrow"><button class="btn green" onclick="(cfg.apiUrl=$(\'s_api\').value.trim(),saveCfg(),alert(\'Saved\'),closeModal())">Save</button></div>')}
function exportAll(){const blob=new Blob([JSON.stringify({data:db,cfg},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='upa_hub_backup_'+todayStr()+'.json';a.click();jadd('Exported backup');save()}
function importAll(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.data&&d.data.people){db=d.data;if(d.cfg)cfg=d.cfg}else if(d.people)db=d;saveCfg();save();alert('Imported OK')}catch(x){alert('Invalid backup')}};r.readAsText(f)}

/* ===== router ===== */
function render(){if($('gsearch').value.trim()&&!detail){return globalSearch($('gsearch').value)}
 ({today:rToday,tasks:rTasks,meetings:rMeetings,people:rPeople,library:rLibrary}[page])()}
function updateBadges(){try{const over=db.tasks.filter(t=>!t.done&&t.date&&t.date<=todayStr()&&matchesScope(t)).length;
 const tb=document.querySelector('nav.tabs button[data-t="tasks"]');
 if(tb&&tb.querySelector){let b=tb.querySelector('.nbadge');
  if(over>0){if(!b){b=document.createElement('span');b.className='nbadge';tb.appendChild(b)}b.textContent=over}
  else if(b)b.remove()}}catch(e){}}
const APP_VER='v4.0';$('verbadge').textContent=APP_VER;render();googleSync();updateBadges();
</script>
</body>
</html>
