<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>UPA Hub</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2330;--border:#2d333b;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;padding-bottom:80px}
header{position:sticky;top:0;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);z-index:50;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:700;color:var(--accent);flex:1}
.iconbtn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px}
#gsearch{width:calc(100% - 32px);max-width:680px;display:block;margin:12px auto 4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:15px;outline:none}
#gsearch:focus{border-color:var(--accent)}
main{padding:6px 16px;max-width:720px;margin:0 auto}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.card:active,.card:hover{border-color:var(--accent)}
.card h3{font-size:16px;font-weight:600;margin-bottom:3px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--border);color:var(--accent);font-size:11px;border-radius:99px;padding:2px 9px;margin:6px 4px 0 0}
.badge.up{color:var(--green)}.badge.past{color:var(--muted)}.badge.warn{color:var(--yellow)}.badge.red{color:var(--red)}
.seclabel{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;font-weight:600}
.fab{position:fixed;right:16px;bottom:150px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(88,166,255,.4);z-index:40}
.chatfab{position:fixed;right:16px;bottom:92px;width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(63,185,80,.4);z-index:40}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:10px;padding:8px 0 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px}
nav.tabs button.active{color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);width:100%;max-width:540px;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:18px 18px 30px;border:1px solid var(--border)}
.modal h2{font-size:17px;margin-bottom:12px;color:var(--accent)}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:15px;outline:none;font-family:inherit}
.modal input:focus,.modal textarea:focus{border-color:var(--accent)}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.backbtn{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.detail h2{font-size:20px;margin-bottom:4px}
.kv{display:flex;gap:8px;margin:4px 0;font-size:14px}.kv b{color:var(--muted);font-weight:500;min-width:72px}
.maplink{display:inline-block;background:var(--card2);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:9px 14px;font-size:14px;text-decoration:none;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:24px;font-weight:700;color:var(--accent)}.stat .l{font-size:11px;color:var(--muted)}
.nextmeet{background:linear-gradient(135deg,#1c2330,#16233a);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:36px 18px;font-size:14px;line-height:1.6}
.taskrow{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px}
.chk{width:20px;height:20px;min-width:20px;border:2px solid var(--muted);border-radius:6px;cursor:pointer;margin-top:1px;text-align:center;line-height:18px;font-size:13px;color:transparent}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.taskrow .t{flex:1}.taskrow .t.done{text-decoration:line-through;color:var(--muted)}
.prog{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--green)}
.foldergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.fold{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer}
.fold .fi{font-size:26px}.fold .fn{font-size:12px;margin-top:5px;color:var(--text)}
.je{border-left:3px solid var(--accent);padding:6px 12px;margin-bottom:10px;background:var(--card);border-radius:0 10px 10px 0}
.je .jt{color:var(--muted);font-size:11px}
.del{float:right;background:none;border:none;color:var(--red);font-size:13px;cursor:pointer}
.chatpanel{position:fixed;right:16px;bottom:152px;width:min(300px,86vw);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;z-index:90;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.chatpanel.open{display:block}
.chatpanel p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.filters{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:99px;padding:5px 13px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chatfs{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
.chatfs.open{display:flex}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card)}
#chatlog{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#1f4f82;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;text-align:center}
.chatbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--card)}
#chatin{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:11px 16px;color:var(--text);font-size:15px;outline:none}
#chatin:focus{border-color:var(--accent)}
.micbtn,.sendbtn{width:47px;height:47px;min-width:47px;border-radius:50%;border:none;font-size:19px;cursor:pointer;color:#fff}
.sendbtn{background:var(--accent)}.micbtn{background:var(--card2);color:var(--accent);border:1px solid var(--border)}
.pairbox{padding:0 28px}.pairbox input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--text);font-size:15px}
@media(min-width:700px){main{padding:6px 24px}}
</style>
</head>
<body>
<header><h1>⌘ UPA Hub</h1><button class="iconbtn" onclick="openSettings()">⚙</button></header>
<input id="gsearch" placeholder="Search everything…" oninput="globalSearch(this.value)">
<main id="content"></main>
<button class="chatfab" title="Chat with your assistant">💬</button>
<button class="fab" onclick="fabAdd()">+</button>
<div class="chatfs" id="chatfs">
 <div class="chathead"><button class="iconbtn" onclick="closeChat()">←</button><b style="flex:1">💬 Your Assistant</b><span class="sub" style="font-size:11px" id="chatstat"></span></div>
 <div id="chatlog"></div>
 <div class="chatbar">
  <input id="chatin" placeholder="Ask anything… e.g. what do I have today?" autocomplete="off" onkeydown="if(event.key==='Enter')sendChat()">
  <button class="micbtn" id="micbtn" onclick="toggleMic()" title="Voice message">🎤</button>
  <button class="sendbtn" onclick="sendChat()">➤</button>
 </div>
</div>
<nav class="tabs">
<button data-t="today" class="active" onclick="go('today')"><span class="ic">☀️</span>Today</button>
<button data-t="tasks" onclick="go('tasks')"><span class="ic">✅</span>Tasks</button>
<button data-t="meetings" onclick="go('meetings')"><span class="ic">📅</span>Meet</button>
<button data-t="people" onclick="go('people')"><span class="ic">👤</span>People</button>
<button data-t="library" onclick="go('library')"><span class="ic">📚</span>Library</button>
</nav>
<div class="modal-bg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="mbox"></div></div>
<script>
const KEY='upa_data_v2',CFG='upa_cfg';
let db=load(),cfg=loadCfg();
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(CFG));return Object.assign({telegram:'https://t.me/Agentalx_bot'},c||{})}catch(e){return{telegram:'https://t.me/Agentalx_bot'}}}
function saveCfg(){localStorage.setItem(CFG,JSON.stringify(cfg))}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.people)return d}catch(e){}
 return {people:[{id:'p1',name:'Sami Kaddoum',role:'Owner',phone:'+33 7 76 46 43 49',email:'samikaddoum@gmail.com',notes:'Based in Marseille, France.',tags:['owner'],gcontact:'synced'}],
 meetings:[{id:'m1',title:'Meeting — Sami Kaddoum',datetime:'2026-08-24T09:00',personId:'p1',location:'11 Rue Néron, Marseille',mapsUrl:'https://www.google.com/maps/search/?api=1&query=11+Rue+N%C3%A9ron+Marseille',agenda:'Confirmed by email. Prepared by your UPA.',status:'upcoming',suggested:[{text:'Prepare agenda doc',done:true},{text:'Send confirmation email',done:true},{text:'Review linked documents',done:true}],notes:'Also in Google Calendar.'}],
 projects:[{id:'pr1',title:'UPA Toolkit',status:'active',log:[{ts:'2026-08-23 17:40',text:'Hub v3 shipped: real in-app chat, library fix, automatic Google sync'}]},{id:'pr2',title:'Real Estate Automation Tool',status:'planned'}],
 tasks:[{id:'k1',text:'Connect Google full access',done:true,date:'2026-08-23',priority:'high',projectId:'pr1',subtasks:[{text:'Calendar + Gmail',done:true},{text:'Contacts + Drive',done:true}],log:[{ts:'2026-08-23 09:30',text:'All scopes authorized and verified'}]},
 {id:'k2',text:'Stable chat connection for UPA Hub',done:false,date:'2026-08-25',priority:'normal',projectId:'pr1',subtasks:[],log:[]}],
 folders:[{id:'f1',name:'Sami Kaddoum',icon:'👤'},{id:'f2',name:'UPA Project',icon:'🚀'}],
 items:[{id:'i1',name:'UPA Authentication Blueprint',type:'pdf',urlOrPath:'https://alxagent0-cloud.github.io/upa-hub/',folderId:'f2',personId:'p1',meetingId:'',addedDate:'2026-08-23'},
 {id:'i2',name:'GitHub Guide',type:'pdf',urlOrPath:'',folderId:'f2',personId:'',meetingId:'',addedDate:'2026-08-23'}],
 journal:[{date:'2026-08-23',entries:[{ts:'09:30',text:'Google ecosystem connected: Calendar, Gmail, Contacts, Drive'},{ts:'11:20',text:'UPA Hub v3: real in-app chat, library fix, automatic Google sync'}]},{date:'2026-08-24',entries:[]}],
 chatSeed:true};}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=id=>db.people.find(p=>p.id===id)||null;
const M=id=>db.meetings.find(m=>m.id===id)||null;
const PR=id=>db.projects.find(p=>p.id===id)||null;
const F=id=>db.folders.find(f=>f.id===id)||null;
const todayStr=()=>new Date().toISOString().slice(0,10);
const nowT=()=>new Date().toTimeString().slice(0,5);
function fmtDT(s){try{return new Date(s).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return s||''}}
function jadd(text){const t=todayStr();let j=db.journal.find(x=>x.date===t);if(!j){j={date:t,entries:[]};db.journal.unshift(j)}j.entries.push({ts:nowT(),text});}

/* ===== navigation ===== */
let page='today',detail=null;
function go(t){page=t;detail=null;$('gsearch').value='';$('chatfs').classList.remove('open');
 document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));render();window.scrollTo(0,0)}
function closeModal(){$('mbg').classList.remove('open')}
function showModal(h){$('mbox').innerHTML=h;$('mbg').classList.add('open')}
/* ===== in-app assistant chat ===== */
const CKEY='upa_chat_log',API_KEY='upa-87d0064fd38e31a72792caea44de6f1a';
function apiUrl(){return (cfg.apiUrl||'')+'/v1/chat/completions'}
function chatLog(){try{return JSON.parse(localStorage.getItem(CKEY))||[]}catch(e){return[]}}
function cpush(role,text){const l=chatLog();l.push({role,text,t:Date.now()});localStorage.setItem(CKEY,JSON.stringify(l.slice(-60)));return l}
function renderChat(){const l=chatLog();$('chatlog').innerHTML=l.map(m=>m.role==='user'?'<div class="msg me">'+esc(m.text)+'</div>':'<div class="msg bot">'+fmtBot(m.text)+'</div>').join('');$('chatlog').scrollTop=1e9}
function fmtBot(t){let h=esc(t);h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a style="color:var(--accent)" href="$2" target="_blank">$1</a>');h=h.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a style="color:var(--accent)" href="$2" target="_blank">$2</a>');return h}
document.querySelector('.chatfab').onclick=()=>{openChat()};
function openChat(){$('chatfs').classList.add('open');if(!chatLog().length){cpush('bot','Hey Sami! 👋 I am your UPA — fully connected to your Google ecosystem (Calendar, Gmail, Contacts, Drive). Ask me things like "what do I have today?" or "where is my blueprint file?"','sys')}renderChat();if(!cfg.apiUrl){pairPrompt()}}
function closeChat(){$('chatfs').classList.remove('open')}
function pairPrompt(){setTimeout(()=>{$('chatlog').insertAdjacentHTML('beforeend','<div class="msg sys">⚙️ One-time link needed. Open Settings ⚙ and paste the Hub Link from the message I sent you on Telegram.</div>');$('chatstat').textContent='not linked';},400)}
async function sendChat(pre){
 const inp=$('chatin');const text=(pre!==undefined?pre:inp.value).trim();if(pre===undefined)inp.value='';if(!text)return;
 if(text.toLowerCase()==='/clear'){localStorage.removeItem(CKEY);renderChat();return}
 cpush('user',text);renderChat();
 if(!cfg.apiUrl){cpush('bot','I am not linked to your agent yet. Open Settings ⚙ (top right) and paste the Hub Link I sent on Telegram.');renderChat();return}
 $('chatin').placeholder='Thinking…';$('sendbtn');
 const hist=chatLog().slice(-14).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
 try{
  const r=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
   body:JSON.stringify({model:'hermes-agent',messages:[{role:'system',content:'You are Sami Kaddoum\'s personal UPA inside his UPA Hub web app. Be concise and warm. When you mention files, meetings or contacts include clickable links when possible.'},...hist,{role:'user',content:text}]})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();const reply=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'(empty reply)';
  cpush('bot',reply);
 }catch(e){cpush('bot','⚠ Connection problem ('+e.message+'). Your agent might be restarting or offline — try again in a minute, or ping me on Telegram.');}
 renderChat();$('chatin').placeholder='Ask anything… e.g. what do I have today?';
}
/* voice input via Web Speech API */
let rec=null;
function toggleMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){sendChatPre('[voice note] (Voice transcription is not supported in this browser — type instead.)');return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='fr-FR';rec.interimResults=false;
 $('micbtn').style.background='var(--red)';
 rec.onresult=e=>{const t=e.results[0][0].transcript;sendChatPre(t)};
 rec.onend=()=>{rec=null;$('micbtn').style.background=''};
 rec.onerror=e=>{rec=null;$('micbtn').style.background='';if(e.error!=='aborted')sendChatPre('(voice error: '+e.error+')')};
 try{rec.start()}catch(e){rec=null}
}
function sendChatPre(t){$('chatin').value=t;sendChat()}
function mapsLink(loc){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc)}

/* ===== TODAY ===== */
function rToday(){
 const now=new Date().toISOString();
 const due=db.tasks.filter(t=>!t.done&&t.date&&t.date<=todayStr());
 const next=db.meetings.filter(m=>m.datetime>=now&&m.status!=='completed').sort((a,b)=>a.datetime.localeCompare(b.datetime));
 const todaysM=db.meetings.filter(m=>m.datetime.slice(0,10)===todayStr());
 const doneToday=db.tasks.filter(t=>t.done&&t.date===todayStr()).length;
 let h='<div class="statgrid">'+
 '<div class="stat"><div class="n">'+due.length+'</div><div class="l">Tasks due</div></div>'+
 '<div class="stat"><div class="n">'+todaysM.length+'</div><div class="l">Meetings today</div></div>'+
 '<div class="stat"><div class="n">'+doneToday+'</div><div class="l">Done today</div></div></div>';
 if(next.length){const m=next[0],p=P(m.personId);
  h+='<div class="seclabel">Next meeting</div><div class="nextmeet" onclick=\'showMeeting("'+m.id+'")\'><h3>'+esc(m.title)+'</h3><div class="sub">'+fmtDT(m.datetime)+(p?' · with '+esc(p.name):'')+'</div>'+(m.mapsUrl?'<a class="maplink" href="'+esc(m.mapsUrl)+'" target="_blank" onclick="event.stopPropagation()">📍 Open in Maps</a>':'')+'</div>';}
 else h+='<div class="seclabel">Next meeting</div><div class="empty" style="padding:18px">Nothing scheduled 🎉</div>';
 h+='<div class="seclabel">Due / overdue tasks</div>';
 if(!due.length)h+='<div class="empty" style="padding:14px">Inbox zero on tasks ✅</div>';
 due.slice(0,6).forEach(t=>h+=taskRow(t));
 const jr=db.journal[0];
 h+='<div class="seclabel">Journal — latest day</div>';
 if(jr){h+='<div class="card" style="cursor:default" onclick="showJournal()"><h3>'+jr.date+'</h3>'+jr.entries.slice(-4).map(e=>'<div class="sub">· '+esc(e.text)+'</div>').join('')+((jr.entries.length>4)?'<div class="sub" style="margin-top:4px">+'+(jr.entries.length-4)+' more — tap to see all</div>':'')+'</div>';}
 else h+='<div class="empty" style="padding:14px">No journal entries yet.</div>';
 $('content').innerHTML=h;
}
function taskRow(t){
 const pr=PR(t.projectId);
 return '<div class="taskrow"><div class="chk'+(t.done?' on':'')+'" onclick="togTask(\''+t.id+'\')">✔</div>'+
 '<div class="t '+(t.done?'done':'')+'" onclick=\'showTask("'+t.id+'")\'><b>'+esc(t.text)+'</b>'+
 (t.priority==='high'?' <span class="badge red">HIGH</span>':'')+
 (pr?' <span class="badge">'+esc(pr.title)+'</span>':'')+
 (t.date?'<div class="sub">'+t.date+'</div>':'')+'</div></div>';
}
function togTask(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done){jadd('Completed task: '+t.text);}save()}

/* ===== TASKS & PROJECTS ===== */
let tfilt='all';
function progOf(pid){const ts=db.tasks.filter(t=>t.projectId===pid);if(!ts.length)return null;return Math.round(100*ts.filter(t=>t.done).length/ts.length)}
function rTasks(){
 let h='<div class="seclabel">Projects</div><div class="foldergrid">';
 if(!db.projects.length)h+='<div class="empty" style="padding:10px">No projects yet</div>';
 db.projects.forEach(p=>{const pc=progOf(p.id);
  h+='<div class="fold" onclick=\'showProject("'+p.id+'")\'><div class="fi">🚀</div><div class="fn">'+esc(p.title)+'</div>'+(pc!=null?'<div class="prog"><i style="width:'+pc+'%"></i></div><div class="sub">'+pc+'%</div>':'')+'</div>';});
 h+='</div>';
 const chips=['all','today','open','done'];
 h+='<div class="filters">'+chips.map(c=>'<span class="chip'+(tfilt===c?' on':'')+'" onclick="tfilt=\''+c+'\';render()">'+c.toUpperCase()+'</span>').join('')+'</div><div class="seclabel">Tasks</div>';
 let list=db.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.date||'zz').localeCompare(b.date||'zz'));
 if(tfilt==='today')list=list.filter(t=>t.date===todayStr());
 if(tfilt==='open')list=list.filter(t=>!t.done);
 if(tfilt==='done')list=list.filter(t=>t.done);
 if(!list.length)h+='<div class="empty">No tasks here. Tap <b style="color:var(--accent)">+</b> to add one.</div>';
 list.forEach(t=>h+=taskRow(t));
 h+='<div class="sub" style="margin-top:10px">🔄 Everything here syncs to your Google ecosystem automatically — Tasks, Calendar, Contacts, Drive. Nothing to press.</div>';
 $('content').innerHTML=h;
}
function showProject(id){detail={kind:'project',id};const p=PR(id);if(!p)return;
 const ts=db.tasks.filter(t=>t.projectId===id),pc=progOf(id);
 let h='<button class="backbtn" onclick="back()">← Back</button><div class="detail"><h2>🚀 '+esc(p.title)+'</h2>';
 if(pc!=null)h+='<div class="prog" style="margin:8px 0"><i style="width:'+pc+'%"></i></div><div class="sub">'+pc+'% complete · '+ts.filter(t=>t.done).length+'/'+ts.length+' tasks done</div>';
 h+='<div class="seclabel">Tasks in this project</div>';
 (ts.length?ts:t=>''&&[]).length; ts.forEach(t=>h+=taskRow(t)); if(!ts.length)h+='<div class="empty" style="padding:10px">No tasks yet.</div>';
 if(p.log&&p.log.length){h+='<div class="seclabel">Accomplishment log</div>';p.log.forEach(l=>h+='<div class="je"><div class="jt">'+l.ts+'</div>'+esc(l.text)+'</div>');}
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'projects\',\''+p.id+'\')">Delete project</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}
function showTask(id){detail={kind:'task',id};const t=db.tasks.find(x=>x.id===id);if(!t)return;const pr=PR(t.projectId);
 let h='<button class="backbtn" onclick="back()">← Back</button><div class="detail"><h2>'+(t.done?'✅ ':'⬜ ')+esc(t.text)+'</h2>';
 h+='<div class="kv"><b>Status</b>'+(t.done?'Done':'Open')+(t.priority==='high'?' · <span style="color:var(--red)">HIGH priority</span>':'')+'</div>';
 if(t.date)h+='<div class="kv"><b>Due</b>'+t.date+'</div>';
 if(pr)h+='<div class="kv"><b>Project</b>'+esc(pr.title)+'</div>';
 h+='<div class="seclabel">Subtasks</div>';
 (t.subtasks||[]).forEach((s,i)=>h+='<div class="taskrow" style="padding:8px"><div class="chk'+(s.done?' on':'')+'" onclick="togSub(\''+id+'\','+i+')">✔</div><div class="t '+(s.done?'done':'')+'">'+esc(s.text)+'</div></div>');
 h+=(t.subtasks&&t.subtasks.length)?'':'<div class="empty" style="padding:8px">None yet.</div>';
 h+='<div class="btnrow"><button class="btn ghost" onclick="addSub(\''+id+'\')">+ Subtask</button><button class="btn ghost" onclick="addAccomplish(\''+id+'\')">📝 Log progress</button></div>';
 if(t.log&&t.log.length){h+='<div class="seclabel">Progress log</div>';t.log.forEach(l=>h+='<div class="je"><div class="jt">'+l.ts+'</div>'+esc(l.text)+'</div>');}
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'tasks\',\''+t.id+'\')">Delete task</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}
function togSub(tid,i){const t=db.tasks.find(x=>x.id===tid);const s=t.subtasks[i];s.done=!s.done;if(s.done)jadd('Subtask done: '+s.text+' ('+t.text+')');save()}
function addSub(tid){const t=db.tasks.find(x=>x.id===tid);
 showModal('<h2>New subtask</h2><input id="fx" placeholder="Subtask description"><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="(db.tasks.find(x=>x.id===\''+tid+'\').subtasks.push({text:$(\'fx\').value.trim()||\'Subtask\',done:false}),save(),closeModal(),showTask(\''+tid+'\'))">Add</button></div>')}
function addAccomplish(tid){const t=db.tasks.find(x=>x.id===tid);
 showModal('<h2>Log progress</h2><label>What did we accomplish / where are we?</label><textarea id="fx" rows="3"></textarea><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveAcc(\''+tid+'\')">Log it</button></div>')}
function saveAcc(tid){const v=$('fx').value.trim();if(!v)return closeModal();
 const t=db.tasks.find(x=>x.id===tid);const stamp=todayStr()+' '+nowT();
 (t.log=t.log||[]).push({ts:stamp,text:v});
 if(t.projectId){const pr=PR(t.projectId);(pr.log=pr.log||[]).push({ts:stamp,text:v+' ('+t.text+')'})}
 jadd(v);save();closeModal();showTask(tid)}
function showJournal(){detail={kind:'journal'};
 let h='<button class="backbtn" onclick="back()">← Back</button><h2 style="margin-bottom:10px">📖 Journal</h2>';
 if(!db.journal.length)h+='<div class="empty">Nothing logged yet. Accomplishments land here automatically.</div>';
 db.journal.forEach(d=>{h+='<div class="seclabel">'+d.date+'</div>';d.entries.forEach(e=>h+='<div class="je"><div class="jt">'+e.ts+'</div>'+esc(e.text)+'</div>')});
 $('content').innerHTML=h;window.scrollTo(0,0)}


/* ===== MEETINGS ===== */
function rMeetings(){
 const now=new Date().toISOString();
 const up=db.meetings.filter(m=>m.datetime>=now&&m.status!=='completed').sort((a,b)=>a.datetime.localeCompare(b.datetime));
 const past=db.meetings.filter(m=>!(m.datetime>=now&&m.status!=='completed')).sort((a,b)=>b.datetime.localeCompare(a.datetime));
 let h='';
 const grp=(l,lb)=>{if(!l.length)return;h+='<div class="seclabel">'+lb+'</div>';
  l.forEach(m=>{const p=P(m.personId);const prep=(m.suggested||[]).filter(s=>!s.done).length;
   h+='<div class="card" onclick=\'showMeeting("'+m.id+'")\'><span class="badge '+(lb==='Upcoming'?'up':'past')+'">'+lb.slice(0,-1)+'</span>'+
   (prep?' <span class="badge warn">⚠ '+prep+' prep left</span>':'')+
   '<h3 style="margin-top:6px">'+esc(m.title)+'</h3><div class="sub">'+fmtDT(m.datetime)+(p?' · '+esc(p.name):'')+(m.location?' · '+esc(m.location):'')+'</div></div>'})};
 grp(up,'Upcoming');grp(past,'Past');
 if(!db.meetings.length)h='<div class="empty">No meetings yet. Tap <b style="color:var(--accent)">+</b> to schedule one — include a location and I build the Maps link.</div>';
 $('content').innerHTML=h}
function showMeeting(id){detail={kind:'meeting',id};const m=M(id);if(!m)return;const p=P(m.personId);
 const docs=db.items.filter(i=>i.meetingId===id);
 let h='<button class="backbtn" onclick="back()">← Back</button><div class="detail"><h2>'+esc(m.title)+'</h2><div class="meta">'+
 '<div class="kv"><b>When</b>'+fmtDT(m.datetime)+'</div>'+
 (p?'<div class="kv"><b>With</b><span style="color:var(--accent)" onclick=\'showPerson("'+p.id+'")\'>'+esc(p.name)+'</span></div>':'')+
 ((m.location)?'<div class="kv"><b>Where</b>'+esc(m.location)+'</div>':'')+
 '<div class="kv"><b>Status</b>'+esc(m.status||'—')+'</div></div>';
 if(m.location)h+='<a class="maplink" href="'+esc(m.mapsUrl||mapsLink(m.location))+'" target="_blank">📍 Open location in Maps</a>';
 if(m.agenda)h+='<div class="seclabel">Agenda</div><div class="card" style="cursor:default">'+esc(m.agenda)+'</div>';
 h+='<div class="seclabel">Prep / suggested tasks</div>';
 (m.suggested||[]).forEach((s,i)=>h+='<div class="taskrow" style="padding:8px"><div class="chk'+(s.done?' on':'')+'" onclick="togPrep(\''+id+'\','+i+')">✔</div><div class="t '+(s.done?'done':'')+'">'+esc(s.text)+'</div></div>');
 h+='<div class="btnrow"><button class="btn ghost" onclick="addPrep(\''+id+'\')">+ Prep item</button></div>';
 h+='<div class="seclabel">Documents ('+docs.length+')</div>';
 (docs.length?docs:[]).forEach(d=>h+='<div class="card" style="cursor:default"><h3>'+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+(d.urlOrPath?' · <a style="color:var(--accent)" href="'+esc(d.urlOrPath)+'" target="_blank">open</a>':'')+'</div></div>');
 if(!docs.length)h+='<div class="empty" style="padding:8px">No files linked. Add them via Library → +.</div>';
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'meetings\',\''+m.id+'\')">Delete meeting</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}
function togPrep(mid,i){const m=M(mid);m.suggested[i].done=!m.suggested[i].done;if(m.suggested[i].done)jadd('Prep done: '+m.suggested[i].text+' ('+m.title+')');save()}
function addPrep(mid){showModal('<h2>New prep item</h2><input id="fx" placeholder="e.g. Send agenda to Alex"><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="(M(\''+mid+'\').suggested.push({text:$(\'fx\').value.trim()||\'Prep\',done:false}),save(),closeModal(),showMeeting(\''+mid+'\'))">Add</button></div>')}

/* ===== PEOPLE ===== */
function rPeople(){let h='';
 if(!db.people.length)h='<div class="empty">No people yet. Tap <b style="color:var(--accent)">+</b>.</div>';
 db.people.forEach(p=>{const ms=db.meetings.filter(m=>m.personId===p.id).length;
  h+='<div class="card" onclick=\'showPerson("'+p.id+'")\'><h3>'+esc(p.name)+(p.gcontact?' 🔁':'')+'</h3><div class="sub">'+esc(p.role||'—')+(ms?' · '+ms+' meeting'+(ms>1?'s':''):'')+'</div>'+(p.tags||[]).map(t=>'<span class="badge">'+esc(t)+'</span>').join('')+'</div>'});
 h+='<div class="sub" style="margin-top:6px">🔁 = saved in Google Contacts automatically — every contact you add lands there too.</div>';
 $('content').innerHTML=h}
function showPerson(id){detail={kind:'person',id};const p=P(id);if(!p)return;
 const ms=db.meetings.filter(m=>m.personId===id).sort((a,b)=>b.datetime.localeCompare(a.datetime));
 const docs=db.items.filter(i=>i.personId===id);
 let h='<button class="backbtn" onclick="back()">← Back</button><div class="detail"><h2>'+esc(p.name)+'</h2>';
 (p.tags||[]).forEach(t=>h+='<span class="badge">'+esc(t)+'</span>');
 h+='<div class="meta">'+(p.role?'<div class="kv"><b>Role</b>'+esc(p.role)+'</div>':'')+
 (p.phone?'<div class="kv"><b>Phone</b>'+esc(p.phone)+'</div>':'')+
 (p.email?'<div class="kv"><b>Email</b>'+esc(p.email)+'</div>':'')+
 (p.notes?'<div class="kv"><b>Notes</b>'+esc(p.notes)+'</div>':'')+'</div>';
 h+='<div class="seclabel">Meetings ('+ms.length+')</div>';
 (ms.length?ms:[]).forEach(m=>h+='<div class="card" onclick=\'showMeeting("'+m.id+'")\'><h3>'+esc(m.title)+'</h3><div class="sub">'+fmtDT(m.datetime)+'</div></div>');
 if(!ms.length)h+='<div class="empty" style="padding:8px">No meetings linked.</div>';
 h+='<div class="seclabel">Documents ('+docs.length+')</div>';
 (docs.length?docs:[]).forEach(d=>h+='<div class="card" style="cursor:default"><h3>'+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+'</div></div>');
 if(!docs.length)h+='<div class="empty" style="padding:8px">No documents linked.</div>';
 h+='</div><button class="del" style="float:none;margin-top:8px" onclick="delItem(\'people\',\''+p.id+'\')">Delete contact</button>';
 $('content').innerHTML=h;window.scrollTo(0,0)}

/* ===== LIBRARY ===== */
let libFolder=null;
function rLibrary(){
 let h='<div class="foldergrid"><div class="fold" onclick="libFolder=null;render()"><div class="fi">🗂️</div><div class="fn">All files</div><div class="sub">'+db.items.length+'</div></div>';
 db.folders.forEach(f=>{const n=db.items.filter(i=>i.folderId===f.id).length;
  h+='<div class="fold" onclick="libFolder=\''+f.id+'\';render()"><div class="fi">'+(f.icon||'📁')+'</div><div class="fn">'+esc(f.name)+'</div><div class="sub">'+n+'</div></div>'});
 h+='</div>';
 if(libFolder){const f=F(libFolder);
  h+='<div class="seclabel">📁 '+esc(f?f.name:'')+'</div>';
  const its=db.items.filter(i=>i.folderId===libFolder);
  if(!its.length)h+='<div class="empty" style="padding:12px">Empty folder.</div>';
  its.forEach(d=>h+=docCard(d));}
 else{const its=db.items.slice().sort((a,b)=>(b.addedDate||'').localeCompare(a.addedDate||''));
  h+='<div class="seclabel">Recent files</div>';
  if(!its.length)h+='<div class="empty" style="padding:12px">Library empty. Tap <b style="color:var(--accent)">+</b> to add files & links.</div>';
  its.forEach(d=>h+=docCard(d));}
 $('content').innerHTML=h}
function openDoc(id){const d=db.items.find(x=>x.id===id);if(!d)return;
 if(d.urlOrPath){window.open(d.urlOrPath,'_blank')}
 else{showModal('<h2>'+esc(d.name)+'</h2><p style="color:var(--muted);font-size:13px;line-height:1.7">This item has no file attached yet. Ask your agent in chat: <b style="color:var(--text)">"attach '+esc(d.name)+'"</b> and it will upload the real file and link it here.</p><div class="btnrow"><button class="btn primary" onclick="closeModal()">OK</button></div>')}}
function docCard(d){const f=F(d.folderId);
 return '<div class="card" onclick="openDoc(\''+d.id+'\')">'+
 '<h3>'+((d.urlOrPath)?'':'🔒 ')+({pdf:'📕',doc:'📘',sheet:'📗',note:'📝',link:'🔗'}[d.type]||'📄')+' '+esc(d.name)+'</h3><div class="sub">'+d.type.toUpperCase()+(f?' · '+esc(f.name):'')+(d.addedDate?' · '+d.addedDate:'')+((d.urlOrPath)?'':' · no file linked yet')+'</div></div>'}

/* ===== forms ===== */
function fabAdd(){
 ({today:fTask,tasks:fTask,meetings:fMeeting,people:fPerson,library:fDoc})[page]()}
function opts(arr,val,key,label){return arr.map(o=>'<option value="'+o.id+'"'+(o.id===val?' selected':'')+'>'+esc(label(o))+'</option>').join('')}
function fTask(){showModal('<h2>New task</h2><label>Task *</label><input id="f_text"><label>Due date</label><input id="f_date" type="date" value="'+todayStr()+'"><label>Priority</label><select id="f_pri"><option>normal</option><option value="high">high</option></select><label>Project</label><select id="f_pid"><option value="">none</option>'+opts(db.projects,null,x=>x.title)+'</select><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTask()">Save</button></div>')}
function saveTask(){const v=$('f_text').value.trim();if(!v)return alert('Task text required');
 db.tasks.push({id:uid(),text:v,done:false,date:$('f_date').value||'',priority:$('f_pri').value==='high'?'high':'normal',projectId:$('f_pid').value,subtasks:[],log:[]});
 save();closeModal()}
function fMeeting(){
 showModal('<h2>New meeting</h2><label>Title *</label><input id="f_title"><label>Date & time</label><input id="f_dt" type="datetime-local"><label>With</label><select id="f_w"><option value="">— none —</option>'+opts(db.people,null,p=>p.name)+'</select><label>Location (address or place name)</label><input id="f_loc" placeholder="Café Central, downtown…"><label>Agenda</label><textarea id="f_ag" rows="2"></textarea><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMeeting()">Save</button></div><p style="color:var(--muted);font-size:12px;margin-top:10px">A Maps pin is generated from the location automatically, plus standard prep tasks.</p>')}
function saveMeeting(){
 const v=$('f_title').value.trim();if(!v)return alert('Title required');
 const loc=$('f_loc').value.trim();
 db.meetings.push({id:uid(),title:v,datetime:$('f_dt').value||new Date().toISOString().slice(0,16),personId:$('f_w').value,location:loc,mapsUrl:loc?mapsLink(loc):'',agenda:$('f_ag').value.trim(),status:'upcoming',
  suggested:[{text:'Prepare agenda',done:false},{text:'Send confirmation',done:false},{text:'Review linked documents',done:false}],notes:''});
 save();closeModal()}
function fPerson(){showModal('<h2>New contact</h2><label>Name *</label><input id="f_n"><label>Role / company</label><input id="f_r"><label>Phone</label><input id="f_p"><label>Email</label><input id="f_e"><label>Tags (comma sep.)</label><input id="f_t"><label>Notes</label><textarea id="f_no" rows="2"></textarea><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePerson()">Save</button></div>')}
function savePerson(){const n=$('f_n').value.trim();if(!n)return alert('Name required');
 db.people.push({id:uid(),name:n,role:$('f_r').value.trim(),phone:$('f_p').value.trim(),email:$('f_e').value.trim(),notes:$('f_no').value.trim(),tags:$('f_t').value.split(',').map(s=>s.trim()).filter(Boolean),gcontact:''});
 save();closeModal()}
function fDoc(){showModal('<h2>Add to Library</h2><label>Name *</label><input id="f_dn"><label>Type</label><select id="f_dy"><option value="pdf">PDF</option><option value="doc">Document</option><option value="sheet">Spreadsheet</option><option value="note">Note</option><option value="link">Link</option></select><label>Link or path</label><input id="f_du" placeholder="https://… or C:/…"><label>Folder</label><select id="f_df"><option value="">— none —</option>'+opts(db.folders,null,f=>f.name)+'</select><label>Linked person</label><select id="f_dp"><option value="">— none —</option>'+opts(db.people,null,p=>p.name)+'</select><label>Linked meeting</label><select id="f_dm"><option value="">— none —</option>'+opts(db.meetings,null,m=>m.title)+'</select><div class="btnrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDoc()">Save</button></div>')}
function saveDoc(){const n=$('f_dn').value.trim();if(!n)return alert('Name required');
 db.items.push({id:uid(),name:n,type:$('f_dy').value,urlOrPath:$('f_du').value.trim(),folderId:$('f_df').value,personId:$('f_dp').value,meetingId:$('f_dm').value,addedDate:todayStr()});
 save();closeModal()}

/* ===== misc ===== */
function delItem(kind,id){
 if(!confirm('Delete this? Linked references are kept but unlinked.'))return;
 db[kind]=db[kind].filter(x=>x.id!==id);
 db.items.forEach(i=>{if(i.personId===id)i.personId='';if(i.meetingId===id)i.meetingId='';if(i.folderId===id)i.folderId=''});
 db.meetings.forEach(m=>{if(m.personId===id)m.personId=''});
 db.tasks.forEach(t=>{if(t.projectId===id)t.projectId=''});
 detail=null;save()}
function back(){if(detail&&detail.kind==='journal'){go('today')}else{detail=null;render()}}
function globalSearch(q){q=q.trim().toLowerCase();if(!q)return render();if(detail)return;
 let hits=[];
 db.people.forEach(p=>{if((p.name+' '+(p.role||'')).toLowerCase().includes(q))hits.push(['👤 '+p.name,(p.role||''),`showPerson('${p.id}')`])});
 db.meetings.forEach(m=>{if((m.title+' '+(m.agenda||'')+' '+(m.location||'')).toLowerCase().includes(q))hits.push(['📅 '+m.title,fmtDT(m.datetime),`showMeeting('${m.id}')`])});
 db.tasks.forEach(t=>{if(t.text.toLowerCase().includes(q))hits.push([((t.done)?'☑ ':'⬜ ')+t.text,(t.date||''),`showTask('${t.id}')`])});
 db.projects.forEach(p=>{if(p.title.toLowerCase().includes(q))hits.push(['🚀 '+p.title,'project',`showProject('${p.id}')`])});
 db.items.forEach(i=>{if(i.name.toLowerCase().includes(q))hits.push(['📄 '+i.name,i.type.toUpperCase(),'openDoc(\''+i.id+'\')'])});
 db.folders.forEach(f=>{if(f.name.toLowerCase().includes(q))hits.push(['📁 '+f.name,'folder','libFolder=\''+f.id+'\';render()'])});
 $('content').innerHTML=hits.length?'<div class="seclabel">'+hits.length+' results</div>'+hits.map(x=>'<div class="card" '+(x[2]?'onclick="'+x[2]+'"':'style="cursor:default"')+'><h3>'+esc(x[0])+'</h3><div class="sub">'+esc(x[1])+'</div></div>').join(''):'<div class="empty">No matches for “'+esc(q)+'”.</div>'}
function openSettings(){
 showModal('<h2>Settings & Data</h2><label>Hub Link (connects the 💬 chat to your agent)</label><input id="s_api" placeholder="https://…trycloudflare.com" value="'+esc(cfg.apiUrl||'')+'">'+
 '<div class="btnrow"><button class="btn ghost" onclick="$(\'imp\').click()">Import backup</button><button class="btn primary" onclick="exportAll()">Export backup</button></div>'+
 '<input type="file" id="imp" accept=".json" style="display:none" onchange="importAll(this)">'+
 '<p style="color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6">Data lives in this browser and syncs to your Google ecosystem automatically. If the chat says “not linked”, get the fresh Hub Link from your latest Telegram message and paste it above.</p>'+
 '<div class="btnrow"><button class="btn green" onclick="(cfg.apiUrl=$(\'s_api\').value.trim(),saveCfg(),alert(\'Saved\'),closeModal())">Save</button></div>')}
function exportAll(){const blob=new Blob([JSON.stringify({data:db,cfg},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='upa_hub_backup_'+todayStr()+'.json';a.click();jadd('Exported backup');save()}
function importAll(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.data&&d.data.people){db=d.data;if(d.cfg)cfg=d.cfg}else if(d.people)db=d;saveCfg();save();alert('Imported OK')}catch(x){alert('Invalid backup')}};r.readAsText(f)}

/* ===== router ===== */
function render(){if($('gsearch').value.trim()&&!detail){return globalSearch($('gsearch').value)}
 ({today:rToday,tasks:rTasks,meetings:rMeetings,people:rPeople,library:rLibrary}[page])()}
render();
</script>
